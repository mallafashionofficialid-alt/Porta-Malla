# Membuat paket Android (APK untuk dipasang langsung + AAB untuk Play Store)
# dari PWA Keuangan Malla, tanpa perlu PWABuilder.
#
# Cara pakai:
# 1. Settings > Secrets and variables > Actions > New repository secret
#    - KEYSTORE_PASSWORD : password kunci penandatanganan (min. 6 karakter, buat yang kuat)
#    - KEYSTORE_BASE64   : (diisi SETELAH build pertama, lihat langkah 3)
# 2. Tab Actions > "Build Android (Keuangan Malla)" > Run workflow
# 3. Build pertama membuat keystore baru. Unduh artifact "SIMPAN-keystore-keuangan-malla"
#    (hanya tersedia 1 hari), simpan baik-baik, lalu isi isinya file .b64 ke secret KEYSTORE_BASE64.
#    Keystore WAJIB sama untuk setiap update aplikasi di Play Store.

name: Build Android (Keuangan Malla)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nama versi (kosongkan = otomatis 1.0.<nomor build>)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: malla
      PACKAGE_ID: id.co.mallaofficial.keuangan
      MANIFEST_URL: https://mallafashionofficialid-alt.github.io/Porta-Malla/keuangan-malla-app/manifest.webmanifest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Siapkan keystore
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/build-tools"
          if [ ${#KS_PASS} -lt 6 ]; then
            echo "::error::Secret KEYSTORE_PASSWORD belum diisi atau kurang dari 6 karakter."
            exit 1
          fi
          mkdir -p android-build out
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android-build/malla.keystore
            echo "NEW_KEYSTORE=0" >> "$GITHUB_ENV"
            echo "Memakai keystore dari secret KEYSTORE_BASE64."
          else
            keytool -genkeypair -keystore android-build/malla.keystore -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=PT Maha Mode Indonesia, O=PT Maha Mode Indonesia, L=Cimahi, ST=Jawa Barat, C=ID"
            echo "NEW_KEYSTORE=1" >> "$GITHUB_ENV"
            echo "::warning::Keystore BARU dibuat. Unduh artifact SIMPAN-keystore-keuangan-malla dan simpan sebagai secret KEYSTORE_BASE64."
          fi

      - name: Buat proyek Android dari manifest PWA
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_PATH: ${{ github.workspace }}/android-build/malla.keystore
          PROJECT_DIR: ${{ github.workspace }}/android-build/project
        run: |
          npm install --no-audit --no-fund
          node build-twa.mjs

      - name: Build APK & AAB
        working-directory: android-build/project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Tanda tangani APK & AAB
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          P=android-build/project/app/build/outputs
          "$BT/zipalign" -f -p 4 "$P/apk/release/app-release-unsigned.apk" android-build/aligned.apk
          "$BT/apksigner" sign --ks android-build/malla.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out out/KeuanganMalla.apk android-build/aligned.apk
          jarsigner -keystore android-build/malla.keystore -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -signedjar out/KeuanganMalla.aab "$P/bundle/release/app-release.aab" "$KEY_ALIAS"
          "$BT/apksigner" verify out/KeuanganMalla.apk

      - name: Buat assetlinks.json (agar address bar hilang)
        run: |
          FP=$(keytool -list -v -keystore android-build/malla.keystore -alias "$KEY_ALIAS" -storepass "$KS_PASS" \
               | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          cat > out/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "$PACKAGE_ID",
              "sha256_cert_fingerprints": ["$FP"]
            }
          }]
          EOF
          cp android-build/project/twa-manifest.json out/
          echo "SHA-256 sertifikat: $FP" >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah paket Android
        uses: actions/upload-artifact@v4
        with:
          name: KeuanganMalla-android-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Siapkan keystore untuk disimpan
        if: env.NEW_KEYSTORE == '1'
        run: |
          mkdir -p keystore-out
          cp android-build/malla.keystore keystore-out/
          base64 -w0 android-build/malla.keystore > keystore-out/KEYSTORE_BASE64.b64

      - name: Unggah keystore (hanya build pertama)
        if: env.NEW_KEYSTORE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: SIMPAN-keystore-keuangan-malla
          path: keystore-out/
          retention-days: 1
